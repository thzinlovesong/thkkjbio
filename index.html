<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thkkj — Bio</title>
  <style>
    /* ========== RESET ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      background: #030303;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 2rem 1rem;
      isolation: isolate;
    }

    /* ========== FUNDO PROFISSIONAL ========== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 70% at 50% -10%, rgba(180, 180, 180, 0.09), transparent 60%),
        radial-gradient(ellipse 60% 50% at 15% 30%, rgba(255, 255, 255, 0.04), transparent 70%),
        radial-gradient(ellipse 60% 50% at 85% 70%, rgba(255, 255, 255, 0.03), transparent 70%),
        radial-gradient(ellipse 80% 60% at 50% 110%, rgba(120, 120, 120, 0.06), transparent 65%),
        linear-gradient(180deg, #030303 0%, #080808 40%, #050505 70%, #020202 100%);
      z-index: -5;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse 80% 75% at 50% 50%, #000 25%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse 80% 75% at 50% 50%, #000 25%, transparent 85%);
      z-index: -4;
      animation: gridShift 50s linear infinite;
    }

    @keyframes gridShift {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 56px 56px, 56px 56px; }
    }

    .bg-layer-2 {
      position: fixed;
      inset: -50%;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 90px 90px;
      transform: rotate(15deg);
      mask-image: radial-gradient(ellipse 55% 55% at 50% 50%, #000 20%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse 55% 55% at 50% 50%, #000 20%, transparent 70%);
      z-index: -3;
      animation: gridShift2 80s linear infinite;
      opacity: 0.7;
    }

    @keyframes gridShift2 {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: -90px 90px, -90px 90px; }
    }

    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      mix-blend-mode: screen;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(200, 200, 200, 0.5), transparent 70%);
      top: -15%;
      left: -10%;
      animation: orbFloat1 22s ease-in-out infinite;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.4), transparent 70%);
      bottom: -15%;
      right: -10%;
      animation: orbFloat2 26s ease-in-out infinite;
    }

    .orb-3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(150, 150, 150, 0.35), transparent 70%);
      top: 40%;
      left: 50%;
      animation: orbFloat3 30s ease-in-out infinite;
    }

    @keyframes orbFloat1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(80px, 60px) scale(1.15); }
      66% { transform: translate(-40px, 100px) scale(0.95); }
    }

    @keyframes orbFloat2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-100px, -80px) scale(1.2); }
    }

    @keyframes orbFloat3 {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.5; }
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 100% 100% at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.7) 100%);
      z-index: -1;
      pointer-events: none;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.85;
    }

    /* ========== CONTAINER ========== */
    .bio-container {
      position: relative;
      width: 100%;
      max-width: 580px;
      z-index: 10;
      perspective: 1200px;
    }

    /* ========== CARD ========== */
    .card {
      position: relative;
      background: linear-gradient(155deg, rgba(20, 20, 20, 0.94), rgba(8, 8, 8, 0.98));
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border-radius: 34px;
      padding: 0 2rem 2rem;
      overflow: hidden;
      isolation: isolate;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.08) inset,
        0 -1px 0 rgba(0, 0, 0, 0.7) inset,
        0 50px 100px -20px rgba(0, 0, 0, 0.98),
        0 20px 60px -10px rgba(0, 0, 0, 0.9);
      animation: cardReveal 1.3s cubic-bezier(0.19, 1, 0.22, 1) both;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      transform-style: preserve-3d;
    }

    @keyframes cardReveal {
      0% {
        opacity: 0;
        transform: translateY(50px) scale(0.94);
        filter: blur(12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* Borda cônica animada */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 34px;
      padding: 1.2px;
      background: conic-gradient(
        from var(--angle, 0deg),
        transparent 0deg,
        rgba(255, 255, 255, 0.55) 30deg,
        rgba(255, 255, 255, 0.05) 90deg,
        transparent 140deg,
        transparent 220deg,
        rgba(255, 255, 255, 0.35) 290deg,
        rgba(255, 255, 255, 0.05) 330deg,
        transparent 360deg
      );
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      animation: rotateBorder 5s linear infinite;
      opacity: 0.95;
      z-index: 2;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.25));
    }

    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes rotateBorder {
      to { --angle: 360deg; }
    }

    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
      filter: blur(0.6px);
      opacity: 0.85;
      z-index: 3;
    }

    /* ========== RACHADURA NO CARD ========== */
    .crack {
      position: absolute;
      inset: 0;
      border-radius: 34px;
      overflow: hidden;
      pointer-events: none;
      z-index: 7;
      opacity: 0.55;
      mix-blend-mode: screen;
    }

    .crack svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .crack path {
      fill: none;
      stroke: url(#crackGradient);
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
      stroke-dasharray: 3000;
      stroke-dashoffset: 3000;
      animation: crackDraw 4s ease-out infinite;
    }

    .crack path.branch {
      stroke-width: 0.7;
      opacity: 0.7;
      filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.7));
      animation-delay: 0.4s;
    }

    .crack path.fine {
      stroke-width: 0.4;
      opacity: 0.5;
      filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.5));
      animation-delay: 0.8s;
    }

    @keyframes crackDraw {
      0% {
        stroke-dashoffset: 3000;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      60% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      85% {
        stroke-dashoffset: 0;
        opacity: 0.7;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 0;
      }
    }

    /* Reflexo do mouse */
    .card-glow {
      position: absolute;
      inset: 0;
      border-radius: 34px;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .card-glow::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.11), transparent 55%);
      left: var(--mx, 50%);
      top: var(--my, 50%);
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.5s ease;
      filter: blur(40px);
    }
    .card:hover .card-glow::before {
      opacity: 1;
    }

    /* ========== BANNER ========== */
    .banner {
      position: relative;
      margin: 0 -2rem;
      height: 180px;
      overflow: hidden;
      z-index: 3;
      background: #0a0a0a;
    }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.95) contrast(1.05) grayscale(0.15);
      transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1), filter 0.5s ease;
    }

    .card:hover .banner img {
      transform: scale(1.05);
      filter: brightness(1.05) contrast(1.08) grayscale(0);
    }

    .banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, transparent 0%, transparent 40%, rgba(8, 8, 8, 0.7) 80%, rgba(8, 8, 8, 0.98) 100%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(0, 0, 0, 0.5), transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: linear-gradient(180deg, #000 0%, transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 100%);
      opacity: 0.5;
      pointer-events: none;
      z-index: 2;
    }

    .banner-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3) 50%, transparent);
      z-index: 4;
      animation: lineGlow 4s ease-in-out infinite;
    }

    @keyframes lineGlow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ========== AVATAR ========== */
    .avatar-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      margin-top: -80px;
      margin-bottom: 1.35rem;
      z-index: 6;
    }

    .avatar-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 190px;
      height: 190px;
      margin: -95px 0 0 -95px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(255, 255, 255, 0.5) 70deg,
        transparent 140deg,
        rgba(255, 255, 255, 0.15) 250deg,
        transparent 320deg,
        transparent 360deg
      );
      animation: spinRing 8s linear infinite;
      filter: blur(10px);
      opacity: 0.75;
      pointer-events: none;
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    .avatar-ring-2 {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 168px;
      height: 168px;
      margin: -84px 0 0 -84px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      animation: spinRingReverse 22s linear infinite;
      pointer-events: none;
    }

    @keyframes spinRingReverse {
      to { transform: rotate(-360deg); }
    }

    .avatar-ring-3 {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150px;
      height: 150px;
      margin: -75px 0 0 -75px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      animation: pulseRing 3.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.07); opacity: 0.85; }
    }

    .avatar {
      position: relative;
      width: 134px;
      height: 134px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
      border: 3px solid rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 8px rgba(6, 6, 6, 0.95),
        0 0 0 9px rgba(255, 255, 255, 0.08),
        0 30px 60px -10px rgba(0, 0, 0, 0.98),
        0 0 90px -10px rgba(255, 255, 255, 0.2);
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.5s ease;
      z-index: 3;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1), filter 0.5s ease;
      filter: brightness(1.05) contrast(1.03);
    }

    .avatar-wrapper:hover .avatar {
      transform: scale(1.06);
      box-shadow:
        0 0 0 8px rgba(6, 6, 6, 0.95),
        0 0 0 9px rgba(255, 255, 255, 0.2),
        0 35px 70px -10px rgba(0, 0, 0, 0.98),
        0 0 120px -10px rgba(255, 255, 255, 0.4);
    }

    .avatar-wrapper:hover .avatar img {
      transform: scale(1.12) rotate(1.5deg);
      filter: brightness(1.15) contrast(1.08);
    }

    .avatar .fallback {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      background: linear-gradient(180deg, #fff, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #060606;
      border: 3px solid #060606;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
    }

    .status-badge::after {
      content: '';
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.9);
      animation: statusPulse 2s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(74, 222, 128, 0.9); }
      50% { transform: scale(1.2); box-shadow: 0 0 18px rgba(74, 222, 128, 1); }
    }

    /* ========== NOME ========== */
    .name-wrap {
      position: relative;
      text-align: center;
      margin-bottom: 0.5rem;
      z-index: 6;
    }

    .name {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      background: linear-gradient(
        100deg,
        #ffffff 0%,
        #d4d4d4 15%,
        #6b6b6b 30%,
        #ffffff 45%,
        #a0a0a0 60%,
        #4a4a4a 75%,
        #e8e8e8 90%,
        #ffffff 100%
      );
      background-size: 250% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: nameShine 6s ease-in-out infinite;
      filter: drop-shadow(0 2px 20px rgba(255, 255, 255, 0.15));
      position: relative;
    }

    @keyframes nameShine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .name-wrap::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70%;
      height: 100%;
      background: radial-gradient(ellipse, rgba(255, 255, 255, 0.12), transparent 70%);
      filter: blur(20px);
      z-index: -1;
      animation: nameGlow 4s ease-in-out infinite;
    }

    @keyframes nameGlow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ========== VERIFICADO BONITINHO ========== */
    .verified-wrap {
      position: relative;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      animation: verifiedFloat 3s ease-in-out infinite;
    }

    @keyframes verifiedFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-2px) rotate(3deg); }
    }

    /* Brilho girando ao redor */
    .verified-wrap::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(255, 255, 255, 0.9) 40deg,
        transparent 80deg,
        transparent 200deg,
        rgba(160, 220, 255, 0.8) 260deg,
        transparent 320deg,
        transparent 360deg
      );
      animation: verifiedSpin 3s linear infinite;
      filter: blur(3px);
      z-index: -1;
      opacity: 0.9;
    }

    @keyframes verifiedSpin {
      to { transform: rotate(360deg); }
    }

    /* Pulso de brilho */
    .verified-wrap::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(180, 220, 255, 0.4), transparent 60%);
      animation: verifiedGlow 2.2s ease-in-out infinite;
      z-index: -2;
    }

    @keyframes verifiedGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.25); }
    }

    /* Selo SVG */
    .verified {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 6px rgba(150, 210, 255, 0.8)) drop-shadow(0 0 14px rgba(120, 180, 255, 0.5));
      animation: verifiedHue 6s linear infinite;
    }

    @keyframes verifiedHue {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(150, 210, 255, 0.8)) drop-shadow(0 0 14px rgba(120, 180, 255, 0.5)); }
      50% { filter: drop-shadow(0 0 8px rgba(255, 255, 255, 1)) drop-shadow(0 0 18px rgba(200, 230, 255, 0.8)); }
    }

    /* Estrelas cintilando ao redor do selo */
    .verified-star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(255, 255, 255, 1), 0 0 12px rgba(150, 210, 255, 0.8);
      pointer-events: none;
    }

    .verified-star.s1 {
      top: -2px;
      left: 50%;
      animation: starTwinkle 2s ease-in-out infinite;
    }

    .verified-star.s2 {
      bottom: -2px;
      right: 40%;
      animation: starTwinkle 2s ease-in-out infinite 0.6s;
    }

    .verified-star.s3 {
      top: 40%;
      right: -3px;
      animation: starTwinkle 2s ease-in-out infinite 1.2s;
    }

    .verified-star.s4 {
      top: 50%;
      left: -3px;
      animation: starTwinkle 2s ease-in-out infinite 1.8s;
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.4); }
    }

    .tagline {
      text-align: center;
      font-size: 0.88rem;
      color: #8a8a8a;
      letter-spacing: 0.5px;
      margin-bottom: 1.9rem;
      font-weight: 400;
      position: relative;
      z-index: 6;
    }

    .tagline::before,
    .tagline::after {
      content: '';
      display: inline-block;
      width: 28px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      vertical-align: middle;
      margin: 0 10px;
    }

    /* ========== DIVISOR ========== */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12) 30%, rgba(255, 255, 255, 0.12) 70%, transparent);
      margin-bottom: 1.6rem;
      position: relative;
      z-index: 6;
    }

    /* ========== BOTÕES ========== */
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      position: relative;
      z-index: 6;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 1.05rem 1.3rem;
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(26, 26, 26, 0.9), rgba(12, 12, 12, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: #e8e8e8;
      text-decoration: none;
      font-weight: 500;
      font-size: 1.02rem;
      letter-spacing: 0.2px;
      overflow: hidden;
      isolation: isolate;
      cursor: pointer;
      transition:
        transform 0.4s cubic-bezier(0.23, 1, 0.32, 1),
        border-color 0.3s ease,
        background 0.4s ease,
        box-shadow 0.4s ease;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.05) inset,
        0 -1px 0 rgba(0, 0, 0, 0.5) inset,
        0 8px 18px -6px rgba(0, 0, 0, 0.85);
      opacity: 0;
      animation: btnSlideIn 0.7s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    .btn:nth-child(1) { animation-delay: 0.4s; }
    .btn:nth-child(2) { animation-delay: 0.5s; }
    .btn:nth-child(3) { animation-delay: 0.6s; }
    .btn:nth-child(4) { animation-delay: 0.7s; }

    @keyframes btnSlideIn {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
        filter: blur(5px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* LED com rastro circulante */
    .btn .led-wrap {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      overflow: hidden;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .btn:hover .led-wrap {
      opacity: 1;
    }

    .btn .led-dot {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, rgba(255, 255, 255, 0.9) 30%, rgba(255, 255, 255, 0) 70%);
      filter: blur(2px);
      top: 50%;
      left: 50%;
      margin: -30px 0 0 -30px;
      transform-origin: center;
      animation: ledOrbit 3s linear infinite;
      offset-path: rect(0 100% 100% 0 round 20px);
      offset-distance: 0%;
      will-change: offset-distance;
    }

    .btn .led-trail {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 1.8px;
      background: conic-gradient(
        from var(--trail-angle, 0deg),
        transparent 0deg,
        transparent 40deg,
        rgba(255, 255, 255, 0.05) 60deg,
        rgba(255, 255, 255, 0.4) 100deg,
        #ffffff 130deg,
        rgba(255, 255, 255, 0.6) 160deg,
        rgba(255, 255, 255, 0.15) 200deg,
        transparent 260deg,
        transparent 360deg
      );
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: trailSpin 3s linear infinite;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.6));
    }

    @property --trail-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes trailSpin {
      to { --trail-angle: 360deg; }
    }

    @keyframes ledOrbit {
      from { offset-distance: 0%; }
      to { offset-distance: 100%; }
    }

    .btn .led-trail-2 {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 1.2px;
      background: conic-gradient(
        from var(--trail-angle-2, 0deg),
        transparent 0deg,
        transparent 60deg,
        rgba(255, 255, 255, 0.7) 100deg,
        rgba(255, 255, 255, 0.2) 140deg,
        transparent 180deg,
        transparent 360deg
      );
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: trailSpin2 3s linear infinite;
      filter: blur(1.5px) drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
      opacity: 0.9;
    }

    @property --trail-angle-2 {
      syntax: '<angle>';
      initial-value: 90deg;
      inherits: false;
    }

    @keyframes trailSpin2 {
      to { --trail-angle-2: 450deg; }
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -130%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        100deg,
        transparent 20%,
        rgba(255, 255, 255, 0.1) 50%,
        transparent 80%
      );
      transition: left 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      pointer-events: none;
      z-index: 1;
    }

    .btn:hover::before {
      left: 130%;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: radial-gradient(circle at 50% 100%, rgba(255, 255, 255, 0.1), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      z-index: 0;
    }

    .btn:hover::after {
      opacity: 1;

        0 18px 34px -8px rgba(0, 0, 0, 0.95),
        0 0 50px -8px rgba(255, 255, 255, 0.18);
    }

    .btn:active {
      transform: translateY(-2px) scale(0.99);
      transition: transform 0.1s ease;
    }

    .btn .icon-box {

      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), background 0.4s ease, border-color 0.4s ease;
      z-index: 2;

      background: linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.06));
      border-color: rgba(255, 255, 255, 0.22);

      height: 21px;
      fill: #d0d0d0;
      transition: fill 0.3s ease, transform 0.4s ease;
      z-index: 2;

  <script>
    (function () {
      "use strict";

      /* ========== MÚSICA AUTOPLAY ========== */
      const audio = document.getElementById("bg-music");
      const musicToggle = document.getElementById("musicToggle");
      let isPlaying = false;

      function fadeInAudio() {
        audio.volume = 0;
        audio.play().then(() => {
          isPlaying = true;
          musicToggle.classList.add("playing");
          const target = 0.3;
          let vol = 0;
          const fade = setInterval(() => {
            vol += 0.02;
            if (vol >= target) {
              audio.volume = target;
              clearInterval(fade);
            } else {
              audio.volume = vol;
            }
          }, 80);
        }).catch(() => {
          isPlaying = false;
          musicToggle.classList.remove("playing");
          const resume = () => {
            fadeInAudio();
            document.removeEventListener("click", resume);
            document.removeEventListener("touchstart", resume);
            document.removeEventListener("keydown", resume);
          };
          document.addEventListener("click", resume, { once: true });
          document.addEventListener("touchstart", resume, { once: true });
          document.addEventListener("keydown", resume, { once: true });
        });
      }

      fadeInAudio();
      window.addEventListener("load", () => { if (!isPlaying) fadeInAudio(); });

      musicToggle.addEventListener("click", () => {
        if (audio.paused) {
          audio.play().then(() => {
            isPlaying = true;
            musicToggle.classList.add("playing");
            audio.volume = 0;
            let vol = 0;
            const fade = setInterval(() => {
              vol += 0.02;
              if (vol >= 0.3) {
                audio.volume = 0.3;
                clearInterval(fade);
              } else {
                audio.volume = vol;
              }
            }, 80);
          }).catch(() => {});
        } else {
          audio.pause();
          isPlaying = false;
          musicToggle.classList.remove("playing");
        }
      });

      /* ========== LUZ QUE SEGUE O MOUSE ========== */
      const card = document.getElementById("card");
      card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        card.style.setProperty("--mx", x + "%");
        card.style.setProperty("--my", y + "%");
      });

      /* ========== PARTÍCULAS ========== */
      const canvas = document.getElementById("particles-canvas");
      const ctx = canvas.getContext("2d");
      let width, height;
      let particles = [];
      const COUNT = 90;
      const MAX_DIST = 140;
      const SPEED = 0.3;

      function initParticles() {
        particles = [];
        for (let i = 0; i < COUNT; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * SPEED * 2,
            vy: (Math.random() - 0.5) * SPEED * 2,
            r: Math.random() * 1.5 + 0.5,
            a: Math.random() * 0.45 + 0.15,
          });
        }
      }

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initParticles();
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        for (let p of particles) {
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255, 255, 255, " + p.a + ")";
          ctx.fill();
        }

        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < MAX_DIST) {
              const opacity = 0.07 * (1 - dist / MAX_DIST);
              ctx.strokeStyle = "rgba(255, 255, 255, " + opacity + ")";
              ctx.lineWidth = 0.5;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      draw();

      /* ========== RIPPLE ========== */
      document.querySelectorAll(".btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          const ripple = document.createElement("span");
          const rect = this.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);
          ripple.style.cssText = `
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            width: ${size}px;
            height: ${size}px;
            left: ${rect.width / 2 - size / 2}px;
            top: ${rect.height / 2 - size / 2}px;
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out;
            pointer-events: none;
            z-index: 5;
          `;
          this.appendChild(ripple);
          setTimeout(() => ripple.remove(), 600);
        });
      });

      const style = document.createElement("style");
      style.textContent = `
        @keyframes rippleAnim {
          to { transform: scale(2.5); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
    })();
  </script>
